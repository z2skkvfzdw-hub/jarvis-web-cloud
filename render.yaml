services:
  - type: web
    name: jarvis-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JARVIS_CLOUD_PROVIDER
        value: openrouter
      - key: JARVIS_OPENROUTER_MODEL
        value: tencent/hy3:free
      - key: OPENROUTER_API_KEY
        sync: false
