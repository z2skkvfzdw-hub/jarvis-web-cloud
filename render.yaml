services:
  - type: web
    name: jarvis-web-cloud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: JARVIS_CLOUD_PROVIDER
        value: nvidia
      - key: JARVIS_PROVIDER_CHAIN
        value: nvidia,groq,openrouter
      - key: NVIDIA_MODEL
        value: openai/gpt-oss-120b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_API_KEY
        sync: false
      - key: JARVIS_GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: JARVIS_OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JARVIS_SESSION_SECRET
        generateValue: true
      - key: JARVIS_PUBLIC_ORIGIN
        value: https://jarvis-web-cloud.onrender.com
      - key: DATABASE_URL
        sync: false
